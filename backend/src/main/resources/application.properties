spring.application.name=demo

# Datasource (overridden by Testcontainers @ServiceConnection under `mvn spring-boot:test-run`)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patchpilot}
spring.datasource.username=${DB_USERNAME:patchpilot}
spring.datasource.password=${DB_PASSWORD:patchpilot}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - schema is managed by Flyway, so Hibernate never writes DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

# Infra starters on the classpath but not used yet - keep them from touching the app
spring.kafka.listener.auto-startup=false
management.health.redis.enabled=false
management.health.kafka.enabled=false

